<!DOCTYPE html>
<html>
<head>
  <title>Skin App - Dashboard</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    #result { margin-top: 20px; font-weight: bold; font-size: 18px; }
    img { max-width: 300px; margin-top: 15px; border-radius: 10px; }
    button { padding: 10px 20px; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>Skin Disease Check</h2>
  <input type="file" id="imageInput" accept="image/*">
  <br>
  <img id="preview" style="display:none;">
  <br>
  <button onclick="checkDisease()">Check Disease</button>
  <div id="result"></div>
<script>
  async function checkDisease() {
    const input = document.getElementById('imageInput');
    const file = input.files[0];
    if (!file) {
      alert("First select a photo");
      return;
    }

    document.getElementById('result').innerText = "Checking...";

    // Preview chupinchadam
    const preview = document.getElementById('preview');
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
// REAL AI - Gemini Backend Connect
let formData = new FormData();
formData.append("image", file);

const response = await fetch("https://diseases-health-care.vercel.app/analyze", {
  method: "POST",
  body: formData
});
const result = await response.json();
console.log(result);

if(result.error){
  document.getElementById('result').innerText = "Error: " + result.error;
} else {
  document.getElementById('result').innerText = "Disease: " + result.disease + " | Confidence: " + result.confidence + "%\nReason: " + result.reason + "\nCause: " + result.cause + "\nPrevention: " + result.prevention + "\nTreatment: " + result.treatment;
}
  }
</script>
</body>
</html>
